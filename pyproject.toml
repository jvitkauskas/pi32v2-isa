[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi32v2-isa"
version = "0.0.1"
description = "pi32v2 ISA reference, instruction table, assembler and disassembler"
license = "MIT-0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pi32v2isa = "pi32v2isa.__main__:main"

[tool.setuptools]
packages = ["pi32v2isa"]
