#
# The pi32v2 instruction table. Format: docs/TABLE-FORMAT.md. Rules: AGENTS.md.

format = 1

# ---- control ----

[[insn]]
id = "nop"
syntax = "nop"
encoding = ["0000000000000000"]
group = "control"
summary = "Do nothing."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "00 00"
text = "nop"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "idle"
syntax = "idle"
encoding = ["0000000000000001"]
group = "control"
summary = "Wait for an interrupt."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]
notes = "Meaning assumed from the name and Blackfin's IDLE; not observed."

[[insn.example]]
bytes = "01 00"
text = "idle"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "csync"
syntax = "csync"
encoding = ["0000000000100000"]
group = "control"
summary = "Core synchronisation barrier."
status = "confirmed"
sources = ["kagaimiq-jielie", "sources-in-use", "oracle"]
notes = "Exact ordering guarantees unknown."

[[insn.example]]
bytes = "20 00"
text = "csync"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "cli"
syntax = "cli"
encoding = ["0000000001100000"]
group = "control"
summary = "Disable interrupts."
status = "confirmed"
sources = ["kagaimiq-jielie", "sources-in-use", "oracle"]

[[insn.example]]
bytes = "60 00"
text = "cli"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "sti"
syntax = "sti"
encoding = ["0000000001100001"]
group = "control"
summary = "Enable interrupts."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "61 00"
text = "sti"
origin = "oracle:objdump+clang:20260730.1"

# ---- returns ----

[[insn]]
id = "rts"
syntax = "rts"
encoding = ["0000000010000000"]
group = "returns"
summary = "Return from a subroutine: continue at the address in rets."
status = "confirmed"
sources = ["kagaimiq-jielie", "sources-in-use", "oracle"]

[[insn.example]]
bytes = "80 00"
text = "rts"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "rti"
syntax = "rti"
encoding = ["0000000010000001"]
group = "returns"
summary = "Return from an interrupt: continue at the address in reti."
status = "confirmed"
sources = ["kagaimiq-jielie", "sources-in-use", "oracle"]

[[insn.example]]
bytes = "81 00"
text = "rti"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "rtx"
syntax = "rtx"
encoding = ["0000000010000010"]
group = "returns"
summary = "Return from an exception: continue at the address in retx."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "82 00"
text = "rtx"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "rte"
syntax = "rte"
encoding = ["0000000010000011"]
group = "returns"
summary = "Return from emulation (debug) mode: continue at the address in rete."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "83 00"
text = "rte"
origin = "oracle:objdump+clang:20260730.1"

# ---- jumps through a register ----

[[insn]]
id = "call.r"
syntax = "call {x}"
encoding = ["000000001100xxxx"]
fields = { x = "gpr" }
group = "jumps"
summary = "Call the subroutine at the address in a register; the return address goes to rets."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "c0 00"
text = "call r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "cf 00"
text = "call r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "goto.r"
syntax = "goto {x}"
encoding = ["000000001101xxxx"]
fields = { x = "gpr" }
group = "jumps"
summary = "Jump to the address in a register."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "d0 00"
text = "goto r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "df 00"
text = "goto r15"
origin = "oracle:objdump+clang:20260730.1"

# ---- moves ----

[[insn]]
id = "mov.rr"
syntax = "{x} = {y}"
encoding = ["00010110yyyyxxxx"]
fields = { x = "gpr", y = "gpr" }
group = "moves"
summary = "Copy one general register to another."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "00 16"
text = "r0 = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "0f 16"
text = "r15 = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "f0 16"
text = "r0 = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "ff 16"
text = "r15 = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "mov.sp_usp"
syntax = "sp = usp"
encoding = ["0001010001000000"]
group = "moves"
summary = "Make the user stack pointer the current stack pointer."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "40 14"
text = "sp = usp"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "mov.sp_ssp"
syntax = "sp = ssp"
encoding = ["0001010001000001"]
group = "moves"
summary = "Make the supervisor stack pointer the current stack pointer."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "41 14"
text = "sp = ssp"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "mov.usp_sp"
syntax = "usp = sp"
encoding = ["0001010001000010"]
group = "moves"
summary = "Save the current stack pointer as the user stack pointer."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "42 14"
text = "usp = sp"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "mov.ssp_sp"
syntax = "ssp = sp"
encoding = ["0001010001000011"]
group = "moves"
summary = "Save the current stack pointer as the supervisor stack pointer."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "43 14"
text = "ssp = sp"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "cc.set"
syntax = "cc = {v}"
encoding = ["000101000000000v"]
fields = { v = "uimm" }
group = "moves"
summary = "Set the condition flag to 0 or 1."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "00 14"
text = "cc = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "01 14"
text = "cc = 1"
origin = "oracle:objdump+clang:20260730.1"

# ---- moves to and from special registers ----

[[insn]]
id = "mov.r_sr"
syntax = "{r} = {s}"
encoding = ["1110000001100100", "rrrrssss00000000"]
fields = { r = "gpr", s = "sr" }
group = "moves"
summary = "Copy a special register to a general register."
status = "confirmed"
sources = ["oracle"]
notes = "Layout found by varying operands with the oracle (docs/ORACLE.md); setting any of the low 7 bits makes objdump reject the word."

[[insn.example]]
bytes = "64 e0 00 00"
text = "r0 = reti"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 00 f0"
text = "r15 = reti"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 00 0f"
text = "r0 = pc"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 00 ff"
text = "r15 = pc"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "mov.sr_r"
syntax = "{s} = {r}"
encoding = ["1110000001100100", "rrrrssss10000000"]
fields = { r = "gpr", s = "sr" }
group = "moves"
summary = "Copy a general register to a special register."
status = "confirmed"
sources = ["oracle"]
notes = "Same word as mov.r_sr with the direction bit set."

[[insn.example]]
bytes = "64 e0 80 00"
text = "reti = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 80 f0"
text = "reti = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 80 0f"
text = "pc = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "64 e0 80 ff"
text = "pc = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "trigger"
syntax = "trigger"
encoding = ["1110100001110000", "0000000000000000"]
group = "control"
summary = "Purpose unknown; used by the FM-1 firmware's second-core start-up."
status = "confirmed"
sources = ["oracle", "sources-in-use"]
notes = "The only second word objdump accepts after e870 is 0000."

[[insn.example]]
bytes = "70 e8 00 00"
text = "trigger"
origin = "oracle:objdump+clang:20260730.1"

# ---- constants ----

[[insn]]
id = "li.u8"
syntax = "{r} = {n}"
encoding = ["001iiiii01jjjrrr"]
fields = { r = "gpr_lo", n = { kind = "uimm", letters = "ji" } }
group = "constants"
summary = "Load an unsigned 8-bit constant (0..255) into r0..r7."
status = "confirmed"
sources = ["oracle"]
notes = "Layout from the oracle's 16-bit decoding sweep: constant bits 7..5 sit in bits 5..3, bits 4..0 in bits 12..8."

[[insn.example]]
bytes = "40 20"
text = "r0 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "78 3f"
text = "r0 = 255"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "47 20"
text = "r7 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "7f 3f"
text = "r7 = 255"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.neg5"
syntax = "{r} = {n}"
encoding = ["001iiiii00010rrr"]
fields = { r = "gpr_lo", n = { kind = "uimm", letters = "i", add = -32 } }
group = "constants"
summary = "Load a constant from -32 to -1 into r0..r7."
status = "confirmed"
sources = ["oracle"]
notes = "From the 16-bit sweep: the field holds the constant + 32."

[[insn.example]]
bytes = "10 20"
text = "r0 = -32"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "10 3f"
text = "r0 = -1"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "17 20"
text = "r7 = -32"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "17 3f"
text = "r7 = -1"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.zero_hi"
syntax = "{r} = 0"
encoding = ["0001010011000rrr"]
fields = { r = "gpr_hi" }
group = "constants"
summary = "Clear one of r8..r15."
status = "confirmed"
sources = ["kagaimiq-jielie", "oracle"]

[[insn.example]]
bytes = "c0 14"
text = "r8 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "c7 14"
text = "r15 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.modimm"
syntax = "{r} = {n}"
encoding = ["1110000001100000", "rrrrnnnnnnnnnnnn"]
fields = { r = "gpr", n = "modimm" }
group = "constants"
summary = "Load a 32-bit constant built from a 12-bit modified immediate (docs/TABLE-FORMAT.md, modimm)."
status = "confirmed"
sources = ["oracle"]
notes = "From the second-word sweep after e060: 8 bits repeated in a pattern or rotated, the scheme ARM Thumb-2 uses; objdump prints it in hex."

[[insn.example]]
bytes = "60 e0 00 00"
text = "r0 = 0x0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "60 e0 ff 0f"
text = "r0 = 0x1FE"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "60 e0 00 f0"
text = "r15 = 0x0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "60 e0 ff ff"
text = "r15 = 0x1FE"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.s16"
syntax = "{r} = {n}"
encoding = ["111000000100rrrr", "iiiiiiiiiiiiiiii"]
fields = { r = "gpr", n = { kind = "simm", letters = "i" } }
group = "constants"
summary = "Load a signed 16-bit constant into a general register."
status = "confirmed"
sources = ["oracle"]
notes = "All 65536 second words decode after e040..e04f."

[[insn.example]]
bytes = "40 e0 00 00"
text = "r0 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "40 e0 ff ff"
text = "r0 = -1"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "4f e0 00 00"
text = "r15 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "4f e0 ff ff"
text = "r15 = -1"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.u32"
syntax = "{r} = {n}"
encoding = ["111111111100rrrr", "iiiiiiiiiiiiiiii", "jjjjjjjjjjjjjjjj"]
fields = { r = "gpr", n = { kind = "uimm", letters = "ji" } }
group = "constants"
summary = "Load a 32-bit constant into a general register; the low half comes first in memory."
status = "confirmed"
sources = ["oracle", "sources-in-use"]
notes = "The FM-1 sources use it for symbol addresses, with relocation R_PI32V2_MOV_ABS32."

[[insn.example]]
bytes = "c0 ff 00 00 00 00"
text = "r0 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "c0 ff ff ff ff ff"
text = "r0 = 4294967295"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "cf ff 00 00 00 00"
text = "r15 = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "cf ff ff ff ff ff"
text = "r15 = 4294967295"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "li.sr_u32"
syntax = "{s} = {n}"
encoding = ["111111111110ssss", "iiiiiiiiiiiiiiii", "jjjjjjjjjjjjjjjj"]
fields = { s = "sr", n = { kind = "uimm", letters = "ji" } }
group = "constants"
summary = "Load a 32-bit constant into a special register; the low half comes first in memory."
status = "confirmed"
sources = ["oracle", "sources-in-use"]
notes = "Layout from the oracle's decoding sweep (docs/ORACLE.md)."

[[insn.example]]
bytes = "e0 ff 00 00 00 00"
text = "reti = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "e0 ff ff ff ff ff"
text = "reti = 4294967295"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "ef ff 00 00 00 00"
text = "pc = 0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "ef ff ff ff ff ff"
text = "pc = 4294967295"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "or.bit"
syntax = "{r} |= {b}"
encoding = ["001bbbbb00110rrr"]
fields = { r = "gpr_lo", b = "bit" }
group = "constants"
summary = "Set one bit of r0..r7; the field is the bit number, printed as its value."
status = "confirmed"
sources = ["oracle"]
notes = "Layout from the oracle's decoding sweep (docs/ORACLE.md)."

[[insn.example]]
bytes = "30 20"
text = "r0 |= 1"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "30 3f"
text = "r0 |= 2147483648"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "37 20"
text = "r7 |= 1"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "37 3f"
text = "r7 |= 2147483648"
origin = "oracle:objdump+clang:20260730.1"

# ---- memory ----

[[insn]]
id = "ld.w.sp"
syntax = "{r} = [sp{+n}]"
encoding = ["001ooooo00p0rrrr"]
fields = { r = "gpr", n = { kind = "uimm", letters = "po", scale = 4 } }
group = "memory"
summary = "Load a word from the stack at sp plus 0..252."
status = "confirmed"
sources = ["oracle"]
notes = "objdump omits the offset when it is 0 ([sp])."

[[insn.example]]
bytes = "00 20"
text = "r0 = [sp]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "20 3f"
text = "r0 = [sp+252]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "0f 20"
text = "r15 = [sp]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "2f 3f"
text = "r15 = [sp+252]"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "st.w.sp"
syntax = "[sp{+n}] = {r}"
encoding = ["001ooooo10p0rrrr"]
fields = { r = "gpr", n = { kind = "uimm", letters = "po", scale = 4 } }
group = "memory"
summary = "Store a word to the stack at sp plus 0..252."
status = "confirmed"
sources = ["oracle"]
notes = "Layout from the oracle's decoding sweep (docs/ORACLE.md)."

[[insn.example]]
bytes = "80 20"
text = "[sp] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "a0 3f"
text = "[sp+252] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "8f 20"
text = "[sp] = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "af 3f"
text = "[sp+252] = r15"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "ld.w"
syntax = "{d} = [{b}+{n}]"
encoding = ["011ooooo0bbb0ddd"]
fields = { d = "gpr_lo", b = "gpr_lo", n = { kind = "simm", letters = "o", scale = 4 } }
group = "memory"
summary = "Load a word from memory at r0..r7 plus -64..60."
status = "confirmed"
sources = ["oracle"]
notes = "objdump prints [r1+0] here, unlike [sp]."

[[insn.example]]
bytes = "00 60"
text = "r0 = [r0+0]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "70 60"
text = "r0 = [r7+0]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "07 60"
text = "r7 = [r0+0]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "00 7f"
text = "r0 = [r0+-4]"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "77 7f"
text = "r7 = [r7+-4]"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "st.w"
syntax = "[{b}+{n}] = {d}"
encoding = ["011ooooo1bbb0ddd"]
fields = { d = "gpr_lo", b = "gpr_lo", n = { kind = "simm", letters = "o", scale = 4 } }
group = "memory"
summary = "Store a word to memory at r0..r7 plus -64..60."
status = "confirmed"
sources = ["oracle"]
notes = "Layout from the oracle's decoding sweep (docs/ORACLE.md)."

[[insn.example]]
bytes = "80 60"
text = "[r0+0] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "f0 60"
text = "[r7+0] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "87 60"
text = "[r0+0] = r7"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "80 7f"
text = "[r0+-4] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "f7 7f"
text = "[r7+-4] = r7"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "ld.bu"
syntax = "{d} = b[{b}+{n}] (u)"
encoding = ["010ooooo0bbb1ddd"]
fields = { d = "gpr_lo", b = "gpr_lo", n = { kind = "simm", letters = "o" } }
group = "memory"
summary = "Load a byte, zero-extended, from memory at r0..r7 plus -16..15."
status = "confirmed"
sources = ["oracle"]
notes = "The assembler also accepts the line without (u); a negative offset is written +-11."

[[insn.example]]
bytes = "08 40"
text = "r0 = b[r0+0] (u)"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "78 40"
text = "r0 = b[r7+0] (u)"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "0f 40"
text = "r7 = b[r0+0] (u)"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "08 5f"
text = "r0 = b[r0+-1] (u)"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "7f 5f"
text = "r7 = b[r7+-1] (u)"
origin = "oracle:objdump+clang:20260730.1"

[[insn]]
id = "st.b"
syntax = "b[{b}+{n}] = {d}"
encoding = ["010ooooo1bbb1ddd"]
fields = { d = "gpr_lo", b = "gpr_lo", n = { kind = "simm", letters = "o" } }
group = "memory"
summary = "Store the low byte of r0..r7 to memory at r0..r7 plus -16..15."
status = "confirmed"
sources = ["oracle"]
notes = "Layout from the oracle's decoding sweep (docs/ORACLE.md)."

[[insn.example]]
bytes = "88 40"
text = "b[r0+0] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "f8 40"
text = "b[r7+0] = r0"
origin = "oracle:objdump+clang:20260730.1"

[[insn.example]]
bytes = "8f 40"
text = "b[r0+0] = r7"
origin = "oracle:objdump+clang:20260730.1"

