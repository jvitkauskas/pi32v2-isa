notes = "Layout from oracle sweep. N is the byte length of the body: JieLi's assembler is written `rep r1 {` + body lines + `}` and fills N in itself (up to 16 words, else 'rep body out of range'); objdump prints `rep N r1 {`, the body indented, then a `}` line. Not confirmed because confirm cannot assemble the one-line text and because objdump omits the ` {` when the rep word is the last word of an enclosing rep body (seen: 'rep 6 r1' for N=6 probes spaced three words apart). Decoding was checked by hand for all 256 words 0300..03ff in isolation."

